# X 自動投稿ツールの設定ファイル
# 秘密情報（APIキー等）はここには書かず、環境変数 / GitHub Secrets で渡します。

# ---- 投稿文の生成設定 ----
generation:
  # 使用する Claude モデル
  model: claude-opus-5
  # 思考の深さ: low / medium / high / xhigh / max
  effort: medium

  # アカウントの人格・語り口
  persona: |
    あなたは個人開発者のXアカウントの中の人です。
    ソフトウェア開発・AI活用・生産性向上について、
    等身大の目線で役に立つ小ネタを日本語で発信します。
    煽らない、断定しすぎない、絵文字は使っても1つまで。

  # 投稿テーマ（毎回この中からランダムに1つ選ばれます）
  themes:
    - "開発効率が上がった小さな習慣"
    - "AIコーディングツールの実践的な使い方"
    - "個人開発でハマりがちな落とし穴と回避策"
    - "エンジニアの学習法・インプット術"
    - "地味だけど効くターミナル/エディタの小技"

  # 文章の制約
  constraints:
    language: ja
    max_chars: 130          # X の上限は 280 だが日本語は全角換算。安全側に短く。
    hashtags: 0             # 付けるハッシュタグ数（0 で無し）
    forbid:
      - "URL（リンク）を含めない"
      - "「〜しましょう！」のような説教くさい締めにしない"
      - "架空の統計や数値を作らない"

  # 直近何件の投稿を「これと被らせないで」と Claude に渡すか
  recent_posts_context: 20

# ---- 投稿設定 ----
posting:
  # 直近の投稿と類似度がこの値以上なら重複とみなして投稿を中止する (0.0-1.0)
  duplicate_similarity_threshold: 0.8
  # 生成のリトライ回数（重複や文字数オーバー時）
  max_generation_attempts: 3

# ---- 履歴ファイル ----
history_path: state/history.json
