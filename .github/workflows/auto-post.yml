name: X 自動投稿

on:
  schedule:
    # GitHub Actions の cron は UTC。以下は 09:00 / 19:00 JST 相当。
    # 混雑時は数分〜十数分遅れて実行されることがあります。
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず生成結果だけ確認する"
        type: boolean
        default: false
      theme:
        description: "テーマを指定する（空ならランダム）"
        type: string
        default: ""

# 同時実行を禁止して履歴ファイルのコミット競合を防ぐ
concurrency:
  group: x-auto-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 投稿
        id: post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PYTHONPATH: src
          # シェルに直接展開せず env 経由で受け取る
          DRY_RUN: ${{ inputs.dry_run }}
          THEME: ${{ inputs.theme }}
        run: |
          set +e
          args=(post)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$THEME" ]; then
            args+=(--theme "$THEME")
          fi
          python -m x_autopost "${args[@]}"
          code=$?
          # 終了コード 2 は「重複のため見送り」なので失敗扱いにしない
          if [ "$code" -eq 2 ]; then
            echo "::notice::重複のため今回の投稿は見送りました"
            code=0
          fi
          exit "$code"

      - name: 投稿履歴をコミット
        if: success() && inputs.dry_run != true
        run: |
          if git diff --quiet -- state/history.json; then
            echo "履歴に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git commit -m "chore: 投稿履歴を更新"
          git pull --rebase --autostash
          git push
